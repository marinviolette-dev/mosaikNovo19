<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mosaïque TV de Martin <3</title>

<link rel="stylesheet" href="style.css">

<style>

body {
    margin: 0;
    overflow: hidden;
}

/* chatons */
.kitten {
    position: fixed;
    width: 100px;
    height: auto;
    z-index: 1;
    pointer-events: none;
    transition:
        transform 1s linear,
        filter 0.15s linear;
}

/* texte au-dessus */
.home h1,
.home .groups {
    position: relative;
    z-index: 10;
}

h1 {
    text-align: center;
    margin-top: 20px;
}

.groups {
    text-align: center;
    margin-top: 20px;
}

button {
    margin: 5px;
}

/* -----------------------------
   STINGER
----------------------------- */

#stinger {
    position: fixed;
    inset: 0;
    z-index: 9999;
    pointer-events: none;
    overflow: hidden;
}

.stinger-layer {
    position: absolute;
    inset: 0;
    transform: translateX(100%);
}

.stinger-layer.purple {
    background: #6f00ff;
}

.stinger-layer.cream {
    background: #f9f2ed;
    display: flex;
    align-items: center;
    justify-content: center;
}

.stinger-layer.cream .logo {
    font-family: "Century Gothic", "CenturyGothic", Arial, sans-serif;
    font-weight: 700;
    color: #6f00ff;
    font-size: 8vw;
    letter-spacing: 2px;
}

</style>
</head>

<body class="home">

<h1>Mosaïque TV de Martin <3</h1>

<div class="groups">

<button onclick="openGroup('g1')">
BFMTV / LCI / CNEWS / France Info
</button>

<button onclick="openGroup('g2')">
BFMTV / LCI / France Info / NOVO19
</button>

<button onclick="openGroup('g3')">
BFMTV / TF1 / France 2 / CNEWS
</button>

<button onclick="openGroup('g4')">
Arte / BFMTV / LCI / NOVO19
</button>    

<button onclick="openGroup('g5')">
Groupe étendu
</button>      

</div>

<div id="stinger">
    <div class="stinger-layer purple"></div>
    <div class="stinger-layer cream"><span class="logo">Novo19</span></div>
</div>

<script>

/* -----------------------------
   STINGER : balayage droite -> gauche avant navigation
----------------------------- */

function openGroup(group){
    playStingerOut(group);
}

/* Réinitialise le stinger, y compris quand la page est restaurée
   depuis le cache de navigation (bouton retour) */
window.addEventListener("pageshow", function(){

    const purple = document.querySelector(".stinger-layer.purple");
    const cream = document.querySelector(".stinger-layer.cream");

    purple.style.transition = "none";
    cream.style.transition = "none";

    purple.style.transform = "translateX(100%)";
    cream.style.transform = "translateX(100%)";

});

function playStingerOut(group){

    const purple = document.querySelector(".stinger-layer.purple");
    const cream = document.querySelector(".stinger-layer.cream");

    /* Étape 1 : le mauve balaie et recouvre l'écran */
    purple.style.transition = "transform 0.45s ease-in";
    purple.style.transform = "translateX(0%)";

    setTimeout(() => {

        /* Étape 2 : le crème (Novo19) arrive juste derrière,
           le mauve continue sa course et sort par la gauche */
        cream.style.transition = "transform 0.45s ease-in";
        cream.style.transform = "translateX(0%)";

        purple.style.transition = "transform 0.45s ease-in";
        purple.style.transform = "translateX(-100%)";

    }, 350);

    setTimeout(() => {

        /* Étape 3 : l'écran est totalement masqué, on navigue */
        window.location.href = "mosaic.html?group=" + group;

    }, 900);

}

const kittenCount = 14;
const kittens = [];

const colorFilters = [
    "hue-rotate(0deg)",
    "hue-rotate(45deg)",
    "hue-rotate(90deg)",
    "hue-rotate(135deg)",
    "hue-rotate(180deg)",
    "hue-rotate(225deg)",
    "hue-rotate(270deg)",
    "hue-rotate(315deg)",
    "saturate(2)",
    "sepia(1)",
    "invert(1)",
    "contrast(1.5)"
];

for(let i = 0; i < kittenCount; i++){

    const el = document.createElement("img");
    el.src = "asset/chaton.jpeg";
    el.className = "kitten";

    document.body.appendChild(el);

    const size = 80 + Math.random() * 80;

    kittens.push({
        el,
        x: Math.random() * (window.innerWidth - size),
        y: Math.random() * (window.innerHeight - size),
        dx: (Math.random() * 3 + 1.5) * (Math.random() < 0.5 ? -1 : 1),
        dy: (Math.random() * 3 + 1.5) * (Math.random() < 0.5 ? -1 : 1),
        size: size,
        rotation: 0,
        spinning: false,
        rainbowInterval: null
    });
}

function randomColorFilter(){

    return colorFilters[
        Math.floor(Math.random() * colorFilters.length)
    ];
}

function spinKitten(k){

    if(k.spinning) return;

    k.spinning = true;
    k.rotation += 360;

    k.el.style.transform =
        `rotate(${k.rotation}deg)`;

    setTimeout(() => {
        k.spinning = false;
    }, 1000);
}

function startRainbow(k){

    stopRainbow(k);

    k.rainbowInterval = setInterval(() => {

        k.el.style.filter = randomColorFilter();

    }, 120);
}

function stopRainbow(k){

    if(k.rainbowInterval){

        clearInterval(k.rainbowInterval);
        k.rainbowInterval = null;
    }
}

function randomImage(){

    const r = Math.random();

    if(r < 0.10){
        return "asset/marin.png";
    }

    if(r < 0.20){
        return "asset/valentin.png";
    }

    if(r < 0.30){
        return "asset/Martin.png";
    }

    return "asset/chaton.jpeg";
}

function animate(){

    for(const k of kittens){

        k.x += k.dx;
        k.y += k.dy;

        const size = k.size;

        let bounced = false;

        if(k.x <= 0 || k.x + size >= window.innerWidth){
            k.dx *= -1;
            bounced = true;
        }

        if(k.y <= 0 || k.y + size >= window.innerHeight){
            k.dy *= -1;
            bounced = true;
        }

        if(bounced){

            const newImage = randomImage();

            k.el.src = newImage;

            if(
                newImage.includes("marin.png") ||
                newImage.includes("valentin.png") ||
                newImage.includes("Martin.png")
            ){
                startRainbow(k);
            }
            else{
                stopRainbow(k);
                k.el.style.filter = randomColorFilter();
            }

            if(Math.random() < 0.5){
                spinKitten(k);
            }
        }

        k.el.style.left = k.x + "px";
        k.el.style.top = k.y + "px";
        k.el.style.width = size + "px";
    }

    requestAnimationFrame(animate);
}

animate();

setInterval(() => {

    const randomKitten =
        kittens[Math.floor(Math.random() * kittens.length)];

    if(Math.random() < 0.35){
        spinKitten(randomKitten);
    }

}, 2000);

</script>

</body>
</html>
