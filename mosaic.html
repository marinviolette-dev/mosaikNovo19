<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Mosaïque TV</title>

<style>

body {
    margin: 0;
    background: black;
    font-family: Arial;
}

/* GRID 2x2 */
#grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    width: 100vw;
    height: 100vh;
    gap: 2px;
    padding: 2px;
    background: #6f00ff;
    box-sizing: border-box;
}

/* GRID 3x3 (groupe 5) */
#grid.grid-3x3 {
    grid-template-columns: 1fr 1fr 1fr;
    grid-template-rows: 1fr 1fr 1fr;
}

/* CHAQUE TILE */
.tile {
    position: relative;
    overflow: hidden;
    background: black;
}

/* LABEL */
.label {
    position: absolute;
    top: 5px;
    left: 5px;
    z-index: 2;
    color: white;
    font-size: 14px;
    background: rgba(0,0,0,0.6);
    padding: 3px 6px;
    border-radius: 4px;
}

/* IFRAME */
iframe {
    width: 100%;
    height: 100%;
    border: none;
}

/* OFFLINE */
.offline {
    position: absolute;
    inset: 0;
    background: #111;
    color: white;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    gap: 10px;
}

.offline h2 {
    margin: 0;
}

.offline small {
    color: #bbb;
}

/* -----------------------------
   STINGER
----------------------------- */

#stinger {
    position: fixed;
    inset: 0;
    z-index: 9999;
    pointer-events: none;
    overflow: hidden;
}

.stinger-layer {
    position: absolute;
    inset: 0;
    transform: translateX(100%);
}

.stinger-layer.purple {
    background: #6f00ff;
    transform: translateX(-100%);
}

.stinger-layer.cream {
    background: #f9f2ed;
    display: flex;
    align-items: center;
    justify-content: center;
    transform: translateX(0%);
}

.stinger-layer.cream .logo {
    font-family: "Century Gothic", "CenturyGothic", Arial, sans-serif;
    font-weight: 700;
    color: #6f00ff;
    font-size: 8vw;
    letter-spacing: 2px;
}

</style>
</head>

<body>

<div id="grid"></div>

<div id="stinger">
    <div class="stinger-layer purple"></div>
    <div class="stinger-layer cream"><span class="logo">Novo19</span></div>
</div>

<script>

/* -----------------------------
   SOURCES (SAFE STRUCTURE)
----------------------------- */

const channels = {

bfmtv: {
name: "BFMTV",
url: "https://live-cdn-bfmtv-euw1.bfmtv.bct.nextradiotv.com/m1/media.m3u8"
},

lci: {
name: "LCI",
url: "https://alive-lci-hls.cdn-0.diff.tf1.fr/eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJjaXAiOiIxODUuMzEuNDAuMjYiLCJjbWNkIjoiIiwiZXhwIjoxNzg4MTkyMzYwLCJnaWQiOiJlMWE4YjFjZi1mNGNlLTQyYzMtOWE3Yi1hZjI5ZmVhYzZmMTEiLCJpYXQiOjE3ODgxNzc5NjAsImlzcyI6ImRlbGl2ZXJ5IiwibWF4YiI6MCwic3RlbSI6Ii9wcm9kL0xDSS9jbWFmL291dCIsInN1YiI6ImUxYThiMWNmLWY0Y2UtNDJjMy05YTdiLWFmMjlmZWFjNmYxMSJ9.s9L_tSVdfm3CU9SLiClDFgKKYrRMyenhBKN8qVsDC74/prod/LCI/cmaf/out/LCI.m3u8"
},

cnews: {
name: "CNEWS",
url: "https://hls-m015-live-aka-canalplus.akamaized.net/live/disk/cnews-clair-hd/hls-v3-hd-clair/cnews-clair-hd.m3u8"
},

franceinfo: {
name: "France Info",
url: "https://www.youtube.com/embed/NG7ZX42nZKc?autoplay=1&mute=1&controls=0&modestbranding=1"
},

novo19: {
name: "NOVO19",
url: "https://novo19.ouest-france.fr/player/novo19"
},

tf1: {
name: "TF1",
url: "https://euronews-live-fre-fr.fast.rakuten.tv/v1/master/0547f18649bd788bec7b67b746e47670f558b6b2/production-LiveChannel-6564/bitok/e/26032/euronews-fr.m3u8"
},

france2: {
name: "France 2",
url: "https://rcavlive.akamaized.net/hls/live/704025/xcanrdi/master.m3u8"
},

arte: {
name: "Arte",
url: "https://artesimulcast.akamaized.net/hls/live/2031003/artelive_fr/index.m3u8"
},

rmcstory: {
name: "RMC Story",
url: "https://live-cdn-rmcstor-lg-fr-euw1.rmc.bct.nextradiotv.com/master.m3u8?bpkio_sessionid=10b0c236c226-ae1d9b34-e3c6-430e-9f23-c1c0db5c0f65&bpkio_serviceid=7de32147a4f1055b03f1535ffa098237&category=all"
},

rmclife: {
name: "RMC Life",
url: "http://s2.callofliberty.fr/direct/RMCDECOUVERTE/manifest.m3u8"
}    

};

/* -----------------------------
   GROUPS
----------------------------- */

const groups = {

g1: [channels.bfmtv, channels.cnews, channels.lci, channels.franceinfo],
g2: [channels.bfmtv, channels.franceinfo, channels.lci, channels.novo19],
g3: [channels.bfmtv, channels.cnews, channels.tf1, channels.france2],
g4: [channels.bfmtv, channels.novo19, channels.arte, channels.lci],
g5: [channels.tf1, channels.france2, channels.bfmtv, channels.cnews, channels.lci, channels.franceinfo, channels.novo19, channels.rmcstory, channels.rmclife],

};

/* -----------------------------
   SAFE ROUTING
----------------------------- */

const params = new URLSearchParams(window.location.search);
const groupId = params.get("group");

if (!groupId || !groups[groupId]) {
    window.location.href = "home.html";
}

const selected = groups[groupId] || groups.g1;

/* -----------------------------
   RECONNECT
----------------------------- */

function reconnectTile(tile, channel){

    tile.innerHTML = `
        <div class="offline">
            <h2>${channel.name}</h2>
            <div>⚠ Flux indisponible</div>
            <small>Nouvelle tentative dans 30 s...</small>
        </div>
    `;

    setTimeout(() => {

        tile.innerHTML = "";

        const label = document.createElement("div");
        label.className = "label";
        label.textContent = channel.name;

        const iframe = document.createElement("iframe");
        iframe.src = channel.url;

        iframe.setAttribute("allow","autoplay; encrypted-media");
        iframe.setAttribute("allowfullscreen","");
        iframe.setAttribute("loading","lazy");

        tile.appendChild(label);
        tile.appendChild(iframe);

    },30000);

}

/* -----------------------------
   GRID SAFE RENDER
----------------------------- */

const grid = document.getElementById("grid");

/* Groupe 5 : grille 3x3 au lieu de 2x2 */
if (groupId === "g5") {
    grid.classList.add("grid-3x3");
}

selected.forEach((channel) => {

    const tile = document.createElement("div");
    tile.className = "tile";

    const label = document.createElement("div");
    label.className = "label";
    label.textContent = channel.name;

    const iframe = document.createElement("iframe");

    iframe.src = channel.url;

    iframe.setAttribute("allow", "autoplay; encrypted-media");
    iframe.setAttribute("allowfullscreen", "");
    iframe.setAttribute("loading", "lazy");

    iframe.style.background = "black";

    let loaded = false;

    iframe.onload = () => {
        loaded = true;
    };

    setTimeout(() => {
        if (!loaded) {
            reconnectTile(tile, channel);
        }
    }, 8000);

    tile.appendChild(label);
    tile.appendChild(iframe);

    grid.appendChild(tile);

});

/* -----------------------------
   STINGER : l'écran est masqué par le crème "Novo19"
   au chargement, puis balaie vers la gauche pour
   révéler la mosaïque
----------------------------- */

window.addEventListener("load", () => {

    const cream = document.querySelector(".stinger-layer.cream");

    setTimeout(() => {

        cream.style.transition = "transform 0.5s ease-in";
        cream.style.transform = "translateX(-100%)";

    }, 400);

});

/* Réinitialise le stinger si la page est restaurée
   depuis le cache de navigation (bouton retour/avant) */
window.addEventListener("pageshow", function(event){

    if (event.persisted) {

        const purple = document.querySelector(".stinger-layer.purple");
        const cream = document.querySelector(".stinger-layer.cream");

        purple.style.transition = "none";
        cream.style.transition = "none";

        purple.style.transform = "translateX(-100%)";
        cream.style.transform = "translateX(0%)";

        setTimeout(() => {

            cream.style.transition = "transform 0.5s ease-in";
            cream.style.transform = "translateX(-100%)";

        }, 200);

    }

});

</script>

</body>
</html>
