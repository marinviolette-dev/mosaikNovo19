<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Mosaïque TV</title>

<style>

body {
    margin: 0;
    background: black;
    font-family: Arial;
}

/* GRID 2x2 */
#grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    width: 100vw;
    height: 100vh;
    gap: 2px;
    padding: 2px;
    background: #6f00ff;
    box-sizing: border-box;
}

/* GRID 3x3 (groupe 5) */
#grid.grid-3x3 {
    grid-template-columns: 1fr 1fr 1fr;
    grid-template-rows: 1fr 1fr 1fr;
}

/* CHAQUE TILE */
.tile {
    position: relative;
    overflow: hidden;
    background: black;
}

/* LABEL */
.label {
    position: absolute;
    top: 5px;
    left: 5px;
    z-index: 2;
    color: white;
    font-size: 14px;
    background: rgba(0,0,0,0.6);
    padding: 3px 6px;
    border-radius: 4px;
}

/* IFRAME */
iframe {
    width: 100%;
    height: 100%;
    border: none;
}

/* OFFLINE */
.offline {
    position: absolute;
    inset: 0;
    background: #111;
    color: white;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    gap: 10px;
}

.offline h2 {
    margin: 0;
}

.offline small {
    color: #bbb;
}

/* -----------------------------
   REFRESH LINK OVERLAY
----------------------------- */

.refresh-btn {
    position: absolute;
    top: 5px;
    right: 5px;
    z-index: 3;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: rgba(0,0,0,0.6);
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    cursor: pointer;
    user-select: none;
    opacity: 0;
    transition: opacity 0.2s ease;
}

.tile:hover .refresh-btn {
    opacity: 1;
}

.refresh-btn.hidden {
    display: none;
}

.link-bar {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    z-index: 4;
    height: 0;
    overflow: hidden;
    background: #6f00ff;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 0 8px;
    box-sizing: border-box;
    transition: height 0.25s ease, padding 0.25s ease;
}

.link-bar.open {
    height: 34px;
    padding: 0 8px;
}

.link-bar input {
    flex: 1;
    min-width: 0;
    border: none;
    border-radius: 4px;
    padding: 5px 8px;
    font-size: 13px;
    outline: none;
}

.link-bar .link-bar-hint {
    color: white;
    font-size: 11px;
    white-space: nowrap;
}

/* -----------------------------
   STINGER
----------------------------- */

#stinger {
    position: fixed;
    inset: 0;
    z-index: 9999;
    pointer-events: none;
    overflow: hidden;
}

.stinger-layer {
    position: absolute;
    inset: 0;
    transform: translateX(100%);
}

.stinger-layer.purple {
    background: #6f00ff;
    transform: translateX(-100%);
}

.stinger-layer.cream {
    background: #f9f2ed;
    display: flex;
    align-items: center;
    justify-content: center;
    transform: translateX(0%);
}

.stinger-layer.cream .logo {
    font-family: "Century Gothic", "CenturyGothic", Arial, sans-serif;
    font-weight: 700;
    color: #6f00ff;
    font-size: 8vw;
    letter-spacing: 2px;
}

</style>
</head>

<body>

<div id="grid"></div>

<div id="stinger">
    <div class="stinger-layer purple"></div>
    <div class="stinger-layer cream"><span class="logo">Novo19</span></div>
</div>

<script>

/* -----------------------------
   SOURCES (SAFE STRUCTURE)
----------------------------- */

const channels = {

bfmtv: {
name: "BFMTV",
url: "https://live-cdn-bfmtv-euw1.bfmtv.bct.nextradiotv.com/m1/media.m3u8"
},

lci: {
name: "LCI",
url: "https://alive-lci-hls.cdn-0.diff.tf1.fr/eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJjaXAiOiIxODUuMzEuNDAuMjYiLCJjbWNkIjoiIiwiZXhwIjoxNzg3NTc4ODE5LCJnaWQiOiI3OTU4ZGMzZi0yYTk1LTRiMmItYjZjYy0zYTMwYTE0ODRmOWMiLCJpYXQiOjE3ODc1NjQ0MTksImlzcyI6ImRlbGl2ZXJ5IiwibWF4YiI6MCwic3RlbSI6Ii9wcm9kL0xDSS9jbWFmL291dCIsInN1YiI6Ijc5NThkYzNmLTJhOTUtNGIyYi1iNmNjLTNhMzBhMTQ4NGY5YyJ9.JN3jAuEJot_XM16ejpMkIOoOkDBDiv_0E34ST504mgw/prod/LCI/cmaf/out/LCI.m3u8"
},

cnews: {
name: "CNEWS",
url: "https://hls-m015-live-aka-canalplus.akamaized.net/live/disk/cnews-clair-hd/hls-v3-hd-clair/cnews-clair-hd.m3u8"
},

franceinfo: {
name: "France Info",
url: "https://www.youtube.com/embed/NG7ZX42nZKc?autoplay=1&mute=1&controls=0&modestbranding=1"
},

novo19: {
name: "NOVO19",
url: "https://novo19.ouest-france.fr/player/novo19"
},

tf1: {
name: "TF1",
url: "https://euronews-live-fre-fr.fast.rakuten.tv/v1/master/0547f18649bd788bec7b67b746e47670f558b6b2/production-LiveChannel-6564/bitok/e/26032/euronews-fr.m3u8"
},

france2: {
name: "France 2",
url: "https://rcavlive.akamaized.net/hls/live/704025/xcanrdi/master.m3u8"
},

arte: {
name: "Arte",
url: "https://artesimulcast.akamaized.net/hls/live/2031003/artelive_fr/index.m3u8"
},

rmcstory: {
name: "RMC Story",
url: "https://live-cdn-rmcstor-lg-fr-euw1.rmc.bct.nextradiotv.com/master.m3u8?bpkio_sessionid=10b0c236c226-ae1d9b34-e3c6-430e-9f23-c1c0db5c0f65&bpkio_serviceid=7de32147a4f1055b03f1535ffa098237&category=all"
},

rmclife: {
name: "RMC Life",
url: "http://s2.callofliberty.fr/direct/RMCDECOUVERTE/manifest.m3u8"
}    

};

/* -----------------------------
   GROUPS
----------------------------- */

const groups = {

g1: [channels.bfmtv, channels.cnews, channels.lci, channels.franceinfo],
g2: [channels.bfmtv, channels.franceinfo, channels.lci, channels.novo19],
g3: [channels.bfmtv, channels.cnews, channels.tf1, channels.france2],
g4: [channels.bfmtv, channels.novo19, channels.arte, channels.lci],
g5: [channels.tf1, channels.france2, channels.bfmtv, channels.cnews, channels.lci, channels.franceinfo, channels.novo19, channels.rmcstory, channels.rmclife],

};

/* -----------------------------
   SAFE ROUTING
----------------------------- */

const params = new URLSearchParams(window.location.search);
const groupId = params.get("group");

if (!groupId || !groups[groupId]) {
    window.location.href = "home.html";
}

const selected = groups[groupId] || groups.g1;

/* -----------------------------
   LIEN PERSONNALISÉ (localStorage)
----------------------------- */

function getStoredUrl(channelKey) {
    return localStorage.getItem("mosaic-link-" + channelKey);
}

function setStoredUrl(channelKey, url) {
    localStorage.setItem("mosaic-link-" + channelKey, url);
}

function getEffectiveUrl(channelKey, channel) {
    return getStoredUrl(channelKey) || channel.url;
}

/* -----------------------------
   RECONNECT
----------------------------- */

function reconnectTile(tile, channelKey, channel){

    tile.innerHTML = `
        <div class="offline">
            <h2>${channel.name}</h2>
            <div>⚠ Flux indisponible</div>
            <small>Nouvelle tentative dans 30 s...</small>
        </div>
    `;

    setTimeout(() => {
        buildTile(tile, channelKey, channel);
    },30000);

}

/* -----------------------------
   CONSTRUCTION D'UNE TUILE
   (label, refresh, barre de collage, iframe)
----------------------------- */

function buildTile(tile, channelKey, channel){

    tile.innerHTML = "";

    const label = document.createElement("div");
    label.className = "label";
    label.textContent = channel.name;

    const iframe = document.createElement("iframe");

    iframe.src = getEffectiveUrl(channelKey, channel);

    iframe.setAttribute("allow", "autoplay; encrypted-media");
    iframe.setAttribute("allowfullscreen", "");
    iframe.setAttribute("loading", "lazy");

    iframe.style.background = "black";

    let loaded = false;

    iframe.onload = () => {
        loaded = true;
    };

    setTimeout(() => {
        if (!loaded) {
            reconnectTile(tile, channelKey, channel);
        }
    }, 8000);

    /* Icône refresh (visible au survol de la tuile) */
    const refreshBtn = document.createElement("div");
    refreshBtn.className = "refresh-btn";
    refreshBtn.textContent = "⟳";
    refreshBtn.title = "Coller un nouveau lien";

    /* Barre de collage (mauve, cachée par défaut) */
    const linkBar = document.createElement("div");
    linkBar.className = "link-bar";

    const linkInput = document.createElement("input");
    linkInput.type = "text";
    linkInput.placeholder = "Coller le nouveau lien ici...";

    const hint = document.createElement("span");
    hint.className = "link-bar-hint";
    hint.textContent = "Entrée";

    linkBar.appendChild(linkInput);
    linkBar.appendChild(hint);

    let closeTimer = null;

    function openBar(){
        clearTimeout(closeTimer);
        linkBar.classList.add("open");
        refreshBtn.classList.add("hidden");
        linkInput.value = "";
        linkInput.focus();
        armCloseTimer();
    }

    function closeBar(){
        linkBar.classList.remove("open");
        refreshBtn.classList.remove("hidden");
    }

    function armCloseTimer(){
        clearTimeout(closeTimer);
        closeTimer = setTimeout(closeBar, 3000);
    }

    refreshBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        openBar();
    });

    /* Toute frappe relance le délai de 3s d'inactivité */
    linkInput.addEventListener("input", armCloseTimer);

    linkInput.addEventListener("keydown", (e) => {

        if (e.key === "Enter") {

            const newUrl = linkInput.value.trim();

            if (newUrl) {
                setStoredUrl(channelKey, newUrl);
                clearTimeout(closeTimer);
                closeBar();
                buildTile(tile, channelKey, channel);
            }

        }

        if (e.key === "Escape") {
            clearTimeout(closeTimer);
            closeBar();
        }

    });

    linkInput.addEventListener("blur", () => {
        armCloseTimer();
    });

    tile.appendChild(label);
    tile.appendChild(iframe);
    tile.appendChild(refreshBtn);
    tile.appendChild(linkBar);

}

/* -----------------------------
   GRID SAFE RENDER
----------------------------- */

const grid = document.getElementById("grid");

/* Groupe 5 : grille 3x3 au lieu de 2x2 */
if (groupId === "g5") {
    grid.classList.add("grid-3x3");
}

/* Retrouve la clé (bfmtv, lci, ...) associée à un objet channel,
   nécessaire pour stocker/retrouver un lien personnalisé */
function findChannelKey(channel){
    return Object.keys(channels).find(key => channels[key] === channel);
}

selected.forEach((channel) => {

    const tile = document.createElement("div");
    tile.className = "tile";

    const channelKey = findChannelKey(channel);

    buildTile(tile, channelKey, channel);

    grid.appendChild(tile);

});

/* -----------------------------
   STINGER : l'écran est masqué par le crème "Novo19"
   au chargement, puis balaie vers la gauche pour
   révéler la mosaïque
----------------------------- */

window.addEventListener("load", () => {

    const cream = document.querySelector(".stinger-layer.cream");

    setTimeout(() => {

        cream.style.transition = "transform 0.5s ease-in";
        cream.style.transform = "translateX(-100%)";

    }, 400);

});

/* Réinitialise le stinger si la page est restaurée
   depuis le cache de navigation (bouton retour/avant) */
window.addEventListener("pageshow", function(event){

    if (event.persisted) {

        const purple = document.querySelector(".stinger-layer.purple");
        const cream = document.querySelector(".stinger-layer.cream");

        purple.style.transition = "none";
        cream.style.transition = "none";

        purple.style.transform = "translateX(-100%)";
        cream.style.transform = "translateX(0%)";

        setTimeout(() => {

            cream.style.transition = "transform 0.5s ease-in";
            cream.style.transform = "translateX(-100%)";

        }, 200);

    }

});

</script>

</body>
</html>
